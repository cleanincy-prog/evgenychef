<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пять вариантов Hero с коллажем</title>
  <style>
    @font-face {
      font-family: "Montserrat Local";
      font-style: normal;
      font-weight: 300 700;
      src: url("../../../public/fonts/montserrat-v31-cyrillic-normal.woff2") format("woff2");
    }
    :root {
      --paper: #f4efe5;
      --paper-light: #fcfaf5;
      --ink: #0a0a0a;
      --gold: #a0792e;
      --muted: #6e665a;
      --rule: #c8c0b3;
    }
    * { box-sizing: border-box; }
    html, body { width: 1600px; min-height: 1770px; }
    body {
      margin: 0;
      padding: 42px 48px 52px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Montserrat Local", Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      height: 84px;
      border-bottom: 1px solid var(--rule);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -.02em;
    }
    header p {
      margin: 0;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 42px 30px;
      padding-top: 34px;
    }
    figure { margin: 0; }
    figure:last-child {
      grid-column: 1 / -1;
      width: calc(50% - 15px);
      justify-self: center;
    }
    figcaption {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 30px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    figcaption b { color: var(--gold); font-weight: 600; }
    img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border: 1px solid var(--rule);
      background: var(--paper-light);
    }
  </style>
</head>
<body>
  <header>
    <h1>Коллаж остаётся · пять способов собрать Hero</h1>
    <p>Evgen Grybenyk · 94 реальных фото в каждом варианте</p>
  </header>
  <main>
    <figure><figcaption><b>01</b> Апертуры в полном коллаже</figcaption><img src="01-grid-apertures.png" alt="Полный коллаж с бумажными апертурами для заголовка и портрета" /></figure>
    <figure><figcaption><b>02</b> Горизонтальная полоса</figcaption><img src="02-horizontal-band.png" alt="Коллаж сверху и снизу спокойной горизонтальной полосы текста" /></figure>
    <figure><figcaption><b>03</b> Диагональные акценты</figcaption><img src="03-diagonal-anchors.png" alt="Диагональная последовательность заголовка, портрета и доказательств" /></figure>
    <figure><figcaption><b>04</b> Коллаж-рамка</figcaption><img src="04-collage-frame.png" alt="Центральный редакционный разворот, обрамлённый коллажем" /></figure>
    <figure><figcaption><b>05</b> Архив слева · личность справа</figcaption><img src="05-reversed-split.png" alt="Доминирующий коллаж слева и поле идентичности справа" /></figure>
  </main>
</body>
</html>
